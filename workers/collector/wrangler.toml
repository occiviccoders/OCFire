name = "ocfire-collector"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Collector every 15 minutes, whether or not anyone is on the site; social posting at :05 and :35.
[triggers]
crons = ["*/15 * * * *", "5,35 * * * *"]

[vars]
SITE = "https://ocfire.pages.dev"
# off | dry_run | live (see src/social.js)
SOCIAL_MODE = "dry_run"
SOCIAL_DAILY_CAP = "15"

[[d1_databases]]
binding = "DB"
database_name = "ocfire-research"
database_id = "4e125d0a-9e10-4343-89db-300f8f44fa26"

[observability]
enabled = true
